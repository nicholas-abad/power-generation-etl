name: ONS staging year validation
run-name: ONS staging validation — ${{ inputs.year }}

on:
  # Registered by the initial feature-branch run; subsequent loads are explicit.
  workflow_dispatch:
    inputs:
      year:
        description: 'One audited year, or the fixed 2019/2024 regression benchmarks'
        required: true
        default: benchmarks
        type: choice
        options:
          - benchmarks
          - '2019'
          - '2020'
          - '2024'
      extractors_commit:
        description: 'Full 40-character energy-extractors commit with individual-plant support'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: ons-staging
  cancel-in-progress: false

jobs:
  rehearse:
    name: ONS ${{ matrix.year }} staging benchmark
    environment: staging
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        year: ${{ fromJSON(inputs.year == 'benchmarks' && '[2019,2024]' || format('[{0}]', inputs.year)) }}
    env:
      EXTRACTORS_COMMIT: ${{ inputs.extractors_commit }}
      BENCHMARK_YEAR: ${{ matrix.year }}
      POSTGRES_HOST: ${{ secrets.POSTGRES_HOST }}
      POSTGRES_PORT: ${{ secrets.POSTGRES_PORT }}
      POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
      POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
      POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
      POSTGRES_SSLMODE: require
    steps:
      - uses: actions/checkout@v4
      - name: Require a pinned extractor revision
        run: '[[ "$EXTRACTORS_COMMIT" =~ ^[0-9a-fA-F]{40}$ ]]'
      - uses: actions/checkout@v4
        with:
          repository: nicholas-abad/energy-extractors
          ref: ${{ env.EXTRACTORS_COMMIT }}
          path: extractors
          token: ${{ secrets.EXTRACTORS_REPO_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: astral-sh/setup-uv@v4
      - name: Install dependencies
        run: |
          uv sync --frozen
          uv sync --project extractors --frozen --extra ons
      - name: Check staging identity and required migration
        run: |
          uv run python src/run_in_environment.py --environment staging --from-process -- \
            psql -X -v ON_ERROR_STOP=1 -c 'SELECT count(*) FROM public.mv_ons_individual_plant_monthly;'
      - name: Capture coal baseline
        run: |
          uv run python src/run_in_environment.py --environment staging --from-process -- \
            uv run python src/check_ons_staging.py --year "$BENCHMARK_YEAR" \
              --report output/coal-before.json
      - name: Extract the audited year
        working-directory: extractors
        run: |
          uv run energy-extract ons --start-year "$BENCHMARK_YEAR" --end-year "$BENCHMARK_YEAR" \
            --all-types --individual-plants-only --output ../extracted_data --log-level INFO
      - name: Require complete downloads and audited source hashes before loading
        run: |
          shopt -s nullglob
          metadata=(extracted_data/extraction_metadata_*.json)
          test "${#metadata[@]}" -eq 1
          uv run python src/check_ons_staging.py --year "$BENCHMARK_YEAR" \
            --preflight-metadata "${metadata[0]}" --report output/source-preflight.json
      - name: Load and repeat the same file
        run: |
          set -o pipefail
          shopt -s nullglob
          files=(extracted_data/ons_*_etl.jsonl)
          test "${#files[@]}" -eq 1
          for attempt in first repeat; do
            uv run python src/run_in_environment.py --environment staging --from-process -- \
              uv run python src/database_management.py load-data ons "${files[0]}" \
                --strict --validation-report "output/validation-$attempt.json" \
                2>&1 | tee "output/load-$attempt.log"
          done
          jq -e '.rows_written == 0 and .invalid_records == 0 and .duplicate_records == 0 and .total_records > 0' \
            output/validation-repeat.json
      - name: Refresh ONS views
        run: |
          uv run python src/run_in_environment.py --environment staging --from-process -- \
            uv run python src/refresh_views.py --source ons
      - name: Reconcile source observations, views, coal and permissions
        run: |
          files=(extracted_data/ons_*_etl.jsonl)
          uv run python src/run_in_environment.py --environment staging --from-process -- \
            uv run python src/check_ons_staging.py --year "$BENCHMARK_YEAR" \
              --baseline output/coal-before.json \
              --expected-jsonl "${files[0]}" --report output/verification.json
      - name: Save verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ons-staging-${{ matrix.year }}-${{ github.run_id }}
          path: |
            output/*.json
            output/load-*.log
            extracted_data/extraction_metadata_*.json
            config/ons-benchmarks.json
          retention-days: 30
