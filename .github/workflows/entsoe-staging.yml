name: ENTSO-E staging unit validation
run-name: ENTSO-E CZ staging validation — ${{ inputs.year || 'offline checks' }}

on:
  push:
    branches: [feat/entsoe-all-fuels]
  workflow_dispatch:
    inputs:
      year:
        description: One complete audited Czech benchmark year
        required: true
        type: choice
        options: ['2019', '2024']
      extractors_commit:
        description: Full 40-character energy-extractors revision
        required: true
        default: b38bfd7f3089478dd60393b66b88b3936ad2b857
        type: string

permissions:
  contents: read

concurrency:
  group: entsoe-staging
  cancel-in-progress: false

jobs:
  extractor-tests:
    name: Offline ENTSO-E parser regressions
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      EXTRACTORS_COMMIT: ${{ inputs.extractors_commit || 'b38bfd7f3089478dd60393b66b88b3936ad2b857' }}
    steps:
      - name: Require a pinned revision
        run: '[[ "$EXTRACTORS_COMMIT" =~ ^[0-9a-fA-F]{40}$ ]]'
      - uses: actions/checkout@v4
        with:
          repository: nicholas-abad/energy-extractors
          ref: ${{ env.EXTRACTORS_COMMIT }}
          token: ${{ secrets.EXTRACTORS_REPO_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: astral-sh/setup-uv@v4
      - name: Run offline parser tests
        run: uv run --frozen --extra entsoe --extra dev pytest src/energy_extractors/entsoe -q

  rehearse:
    name: CZ ${{ inputs.year }} staging benchmark
    if: github.event_name == 'workflow_dispatch'
    needs: extractor-tests
    environment: staging
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      EXTRACTORS_COMMIT: ${{ inputs.extractors_commit }}
      BENCHMARK_YEAR: ${{ inputs.year }}
      POSTGRES_HOST: ${{ secrets.POSTGRES_HOST }}
      POSTGRES_PORT: ${{ secrets.POSTGRES_PORT }}
      POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
      POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
      POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
      POSTGRES_SSLMODE: require
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: nicholas-abad/energy-extractors
          ref: ${{ env.EXTRACTORS_COMMIT }}
          path: extractors
          token: ${{ secrets.EXTRACTORS_REPO_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: astral-sh/setup-uv@v4
      - name: Install dependencies
        run: |
          uv sync --frozen
          uv sync --project extractors --frozen --extra entsoe
      - name: Check staging identity and migration 018
        run: |
          uv run python src/run_in_environment.py --environment staging --from-process -- \
            psql -X -v ON_ERROR_STOP=1 -c 'SELECT unit_eic, production_unit_eic, source_unit_name FROM ingestion.entsoe_generation_data LIMIT 0;' \
              -c 'SELECT count(*) FROM public.mv_entsoe_unit_monthly;'
      - name: Capture pre-load coal baseline
        run: |
          uv run python src/run_in_environment.py --environment staging --from-process -- \
            uv run python src/check_entsoe_staging.py --year "$BENCHMARK_YEAR" \
              --phase baseline --report output/coal-before.json
      - name: Download identified units for one full year
        working-directory: extractors
        env:
          ENTSOE_API_KEY: ${{ secrets.ENTSOE_API_KEY }}
        run: |
          uv run energy-extract entsoe --countries CZ --start-year "$BENCHMARK_YEAR" --end-year "$BENCHMARK_YEAR" \
            --all-fuels --yes --output ../extracted_data
      - name: Require audited source and preserved existing measurements before loading
        run: |
          shopt -s nullglob
          files=(extracted_data/entsoe_*_etl.jsonl)
          test "${#files[@]}" -eq 1
          uv run python src/run_in_environment.py --environment staging --from-process -- \
            uv run python src/check_entsoe_staging.py --year "$BENCHMARK_YEAR" --phase preflight \
              --require-audited --input "${files[0]}" --manifest extracted_data/entsoe_unit_manifest.json \
              --report output/source-preflight.json
      - name: Load and repeat the identical file
        run: |
          set -o pipefail
          files=(extracted_data/entsoe_*_etl.jsonl)
          for attempt in first repeat; do
            uv run python src/run_in_environment.py --environment staging --from-process -- \
              uv run python src/database_management.py load-data entsoe "${files[0]}" \
                --strict --validation-report "output/validation-$attempt.json" \
                2>&1 | tee "output/load-$attempt.log"
          done
          jq -e '.rows_written == 0 and .invalid_records == 0 and .duplicate_records == 0 and .total_records > 0' \
            output/validation-repeat.json
      - name: Refresh ENTSO-E views
        run: |
          uv run python src/run_in_environment.py --environment staging --from-process -- \
            uv run python src/refresh_views.py --source entsoe
      - name: Reconcile source, monthly units, coal and reader permissions
        run: |
          files=(extracted_data/entsoe_*_etl.jsonl)
          uv run python src/run_in_environment.py --environment staging --from-process -- \
            uv run python src/check_entsoe_staging.py --year "$BENCHMARK_YEAR" --phase verify \
              --require-audited --input "${files[0]}" --manifest extracted_data/entsoe_unit_manifest.json \
              --baseline output/coal-before.json --report output/verification.json
      - name: Save reports and exact API responses
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: entsoe-cz-${{ inputs.year }}-${{ github.run_id }}
          path: |
            output/*.json
            output/load-*.log
            extracted_data/entsoe_unit_manifest.json
            extracted_data/source_xml/
            config/entsoe-benchmarks.json
            config/entsoe-unit-aliases.json
          retention-days: 30
