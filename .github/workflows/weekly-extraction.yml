name: Weekly Data Extraction
run-name: >-
  Weekly Data Extraction —
  ${{
    (inputs.source == '' || inputs.source == 'all') && 'all sources'
    || inputs.source
  }}${{
    inputs.start_override != ''
    && format(' · {0} → {1}', inputs.start_override, inputs.end_override != '' && inputs.end_override || 'today')
    || ''
  }}

on:
  schedule:
    # Weekly: Sundays 06:23 UTC. The off-:00 minute reduces the top-of-hour
    # scheduling congestion that made the old monthly run fire ~5h late.
    # Each extractor is incremental (last-loaded date → today), so a weekly
    # cadence just keeps the per-run window small (~7 days).
    - cron: '23 6 * * 0'
  workflow_dispatch:      # Manual trigger from GitHub UI
    inputs:
      source:
        description: 'Source to extract'
        required: false
        default: 'all'
        type: choice
        options:
          - 'all'
          - 'EIA (USA)'
          - 'ENTSOE (Europe)'
          - 'NPP (India)'
          - 'ONS (Brazil)'
          - 'OE (Australia)'
          - 'OCCTO (Japan)'
          - 'Chile (Coordinador)'
          - 'Climate TRACE (global)'
      start_override:
        description: 'Re-run window start (YYYY-MM-DD). Leave blank for default (latest in DB).'
        required: false
        default: ''
      end_override:
        description: 'Re-run window end (YYYY-MM-DD). Leave blank for default (today).'
        required: false
        default: ''

permissions:
  contents: read
  issues: write

env:
  POSTGRES_HOST: ${{ secrets.POSTGRES_HOST }}
  POSTGRES_PORT: ${{ secrets.POSTGRES_PORT }}
  POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
  POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
  POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
  POSTGRES_SSLMODE: require

jobs:
  # ─────────────────────────────────────────────
  # EIA (USA) — Monthly generator-level data
  # No API key needed. Uses --start-year/--end-year.
  # ─────────────────────────────────────────────
  extract-eia:
    if: ${{ github.event.inputs.source == '' || github.event.inputs.source == 'all' || github.event.inputs.source == 'EIA (USA)' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Per-source serialization: any second run targeting EIA (cron, "all",
    # or explicit "EIA (USA)") queues behind the in-flight one.
    concurrency:
      group: extract-eia
      cancel-in-progress: false
    steps:
      - name: Checkout ETL repo
        uses: actions/checkout@v4

      - name: Checkout extractors repo
        uses: actions/checkout@v4
        with:
          repository: nicholas-abad/energy-extractors
          path: extractors
          token: ${{ secrets.EXTRACTORS_REPO_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install ETL dependencies
        run: uv sync

      - name: Install extractor dependencies
        run: |
          cd extractors
          uv sync --extra eia

      - name: Resolve extraction window
        id: latest
        uses: ./.github/actions/resolve-window
        with:
          source: eia
          start_override: ${{ inputs.start_override }}
          end_override: ${{ inputs.end_override }}

      - name: Extract EIA data
        run: |
          cd extractors
          uv run energy-extract eia \
            --start-year "${{ steps.latest.outputs.start_year }}" \
            --end-year "${{ steps.latest.outputs.end_year }}" \
            --output ../extracted_data \
            --log-level INFO

      - name: Load EIA data into Neon
        run: |
          for f in extracted_data/eia_*_etl.jsonl; do
            echo "Loading $f..."
            uv run python src/database_management.py load-data eia "$f"
          done

      - name: Upload artifacts (on failure only)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: eia-extraction-${{ github.run_id }}
          path: |
            extracted_data/*.jsonl
            extracted_data/logs/
            extracted_data/extraction_metadata_*.json
          retention-days: 14

  # ─────────────────────────────────────────────
  # ONS (Brazil) — Hourly plant-level from S3 Parquet
  # No API key needed. Uses --start-year/--end-year.
  # ─────────────────────────────────────────────
  extract-ons:
    if: ${{ github.event.inputs.source == '' || github.event.inputs.source == 'all' || github.event.inputs.source == 'ONS (Brazil)' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency:
      group: extract-ons
      cancel-in-progress: false
    steps:
      - name: Checkout ETL repo
        uses: actions/checkout@v4

      - name: Checkout extractors repo
        uses: actions/checkout@v4
        with:
          repository: nicholas-abad/energy-extractors
          path: extractors
          token: ${{ secrets.EXTRACTORS_REPO_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install ETL dependencies
        run: uv sync

      - name: Install extractor dependencies
        run: |
          cd extractors
          uv sync --extra ons

      - name: Resolve extraction window
        id: latest
        uses: ./.github/actions/resolve-window
        with:
          source: ons
          start_override: ${{ inputs.start_override }}
          end_override: ${{ inputs.end_override }}

      - name: Extract ONS data
        run: |
          cd extractors
          uv run energy-extract ons \
            --start-year "${{ steps.latest.outputs.start_year }}" \
            --end-year "${{ steps.latest.outputs.end_year }}" \
            --output ../extracted_data \
            --log-level INFO

      - name: Load ONS data into Neon
        run: |
          for f in extracted_data/ons_*_etl.jsonl; do
            echo "Loading $f..."
            uv run python src/database_management.py load-data ons "$f"
          done

      - name: Upload artifacts (on failure only)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ons-extraction-${{ github.run_id }}
          path: |
            extracted_data/*.jsonl
            extracted_data/logs/
            extracted_data/extraction_metadata_*.json
          retention-days: 14

  # ─────────────────────────────────────────────
  # ENTSOE (Europe) — Hourly plant-level via API
  # Requires ENTSOE_API_KEY. Date via env vars.
  # ─────────────────────────────────────────────
  extract-entsoe:
    if: ${{ github.event.inputs.source == '' || github.event.inputs.source == 'all' || github.event.inputs.source == 'ENTSOE (Europe)' }}
    runs-on: ubuntu-latest
    timeout-minutes: 350
    concurrency:
      group: extract-entsoe
      cancel-in-progress: false
    steps:
      - name: Checkout ETL repo
        uses: actions/checkout@v4

      - name: Checkout extractors repo
        uses: actions/checkout@v4
        with:
          repository: nicholas-abad/energy-extractors
          path: extractors
          token: ${{ secrets.EXTRACTORS_REPO_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install ETL dependencies
        run: uv sync

      - name: Install extractor dependencies
        run: |
          cd extractors
          uv sync --extra entsoe

      - name: Extract ENTSOE month-by-month
        env:
          ENTSOE_API_KEY: ${{ secrets.ENTSOE_API_KEY }}
          START_OVERRIDE: ${{ inputs.start_override }}
          END_OVERRIDE: ${{ inputs.end_override }}
        run: uv run python src/incremental_extract.py entsoe

      - name: Upload artifacts (on failure only)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: entsoe-extraction-${{ github.run_id }}
          path: |
            extracted_data/*.jsonl
            extracted_data/logs/
            extracted_data/extraction_metadata_*.json
          retention-days: 14

  # ─────────────────────────────────────────────
  # NPP (India) — Daily plant-level via HTTP
  # No API key. Uses --start-date/--end-date.
  # ─────────────────────────────────────────────
  extract-npp:
    if: ${{ github.event.inputs.source == '' || github.event.inputs.source == 'all' || github.event.inputs.source == 'NPP (India)' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    concurrency:
      group: extract-npp
      cancel-in-progress: false
    steps:
      - name: Checkout ETL repo
        uses: actions/checkout@v4

      - name: Checkout extractors repo
        uses: actions/checkout@v4
        with:
          repository: nicholas-abad/energy-extractors
          path: extractors
          token: ${{ secrets.EXTRACTORS_REPO_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install ETL dependencies
        run: uv sync

      - name: Install extractor dependencies
        run: |
          cd extractors
          uv sync --extra npp

      - name: Resolve extraction window
        id: latest
        uses: ./.github/actions/resolve-window
        with:
          source: npp
          start_override: ${{ inputs.start_override }}
          end_override: ${{ inputs.end_override }}

      - name: Extract NPP data
        run: |
          cd extractors
          uv run energy-extract npp \
            --start-date "${{ steps.latest.outputs.start_date }}" \
            --end-date "${{ steps.latest.outputs.end_date }}" \
            --output ../extracted_data \
            --log-level INFO

      - name: Load NPP data into Neon
        run: |
          for f in extracted_data/npp_*_etl.jsonl; do
            echo "Loading $f..."
            uv run python src/database_management.py load-data npp "$f"
          done

      - name: Upload artifacts (on failure only)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: npp-extraction-${{ github.run_id }}
          path: |
            extracted_data/*.jsonl
            extracted_data/logs/
            extracted_data/extraction_metadata_*.json
          retention-days: 14

  # ─────────────────────────────────────────────
  # OpenElectricity (Australia) — Daily facility data via API
  # Optional OE_API_KEY. Uses --start-date.
  # ─────────────────────────────────────────────
  extract-oe:
    if: ${{ github.event.inputs.source == '' || github.event.inputs.source == 'all' || github.event.inputs.source == 'OE (Australia)' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency:
      group: extract-oe
      cancel-in-progress: false
    steps:
      - name: Checkout ETL repo
        uses: actions/checkout@v4

      - name: Checkout extractors repo
        uses: actions/checkout@v4
        with:
          repository: nicholas-abad/energy-extractors
          path: extractors
          token: ${{ secrets.EXTRACTORS_REPO_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install ETL dependencies
        run: uv sync

      - name: Install extractor dependencies
        run: |
          cd extractors
          uv sync --extra openelectricity

      - name: Resolve extraction window
        id: latest
        uses: ./.github/actions/resolve-window
        with:
          source: oe
          start_override: ${{ inputs.start_override }}
          end_override: ${{ inputs.end_override }}

      - name: Extract OpenElectricity data
        env:
          OPENELECTRICITY_API_KEY: ${{ secrets.OE_API_KEY }}
        run: |
          cd extractors
          uv run energy-extract openelectricity \
            --start-date "${{ steps.latest.outputs.start_date }}" \
            --end-date "${{ steps.latest.outputs.end_date }}" \
            --output ../extracted_data \
            --facilities \
            --log-level INFO

      - name: Load OE facility data into Neon
        run: |
          for f in extracted_data/*_etl.jsonl; do
            echo "Loading $f..."
            uv run python src/database_management.py load-data oe_facility "$f"
          done

      - name: Upload artifacts (on failure only)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: oe-extraction-${{ github.run_id }}
          path: |
            extracted_data/*.jsonl
            extracted_data/logs/
            extracted_data/extraction_metadata_*.json
          retention-days: 14

  # ─────────────────────────────────────────────
  # OCCTO (Japan) — Half-hourly via Selenium
  # No API key. Needs headless Chrome.
  # ─────────────────────────────────────────────
  extract-occto:
    if: ${{ github.event.inputs.source == '' || github.event.inputs.source == 'all' || github.event.inputs.source == 'OCCTO (Japan)' }}
    runs-on: ubuntu-latest
    timeout-minutes: 350
    concurrency:
      group: extract-occto
      cancel-in-progress: false
    steps:
      - name: Checkout ETL repo
        uses: actions/checkout@v4

      - name: Checkout extractors repo
        uses: actions/checkout@v4
        with:
          repository: nicholas-abad/energy-extractors
          path: extractors
          token: ${{ secrets.EXTRACTORS_REPO_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install ETL dependencies
        run: uv sync

      - name: Install extractor dependencies
        run: |
          cd extractors
          uv sync --extra occto

      - name: Extract OCCTO month-by-month
        env:
          START_OVERRIDE: ${{ inputs.start_override }}
          END_OVERRIDE: ${{ inputs.end_override }}
        run: uv run python src/incremental_extract.py occto

      - name: Upload artifacts (on failure only)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: occto-extraction-${{ github.run_id }}
          path: |
            extracted_data/*.jsonl
            extracted_data/logs/
            extracted_data/extraction_metadata_*.json
          retention-days: 14

  # ─────────────────────────────────────────────
  # Chile (Coordinador) — Hourly plant-level coal via SIP API
  # Requires CL_API_KEY (Coordinador SIP token). Date via resolve-window.
  # Default quota is 60 req/hr — a weekly increment for 12 coal plants is
  # roughly 12 requests, well within the timeout below.
  # ─────────────────────────────────────────────
  extract-chile:
    if: ${{ github.event.inputs.source == '' || github.event.inputs.source == 'all' || github.event.inputs.source == 'Chile (Coordinador)' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    concurrency:
      group: extract-chile
      cancel-in-progress: false
    steps:
      - name: Checkout ETL repo
        uses: actions/checkout@v4

      - name: Checkout extractors repo
        uses: actions/checkout@v4
        with:
          repository: nicholas-abad/energy-extractors
          path: extractors
          token: ${{ secrets.EXTRACTORS_REPO_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install ETL dependencies
        run: uv sync

      - name: Install extractor dependencies
        run: |
          cd extractors
          uv sync --extra chile

      - name: Resolve extraction window
        id: latest
        uses: ./.github/actions/resolve-window
        with:
          source: chile
          start_override: ${{ inputs.start_override }}
          end_override: ${{ inputs.end_override }}

      - name: Extract Chile data
        env:
          CL_API_KEY: ${{ secrets.CL_API_KEY }}
        run: |
          cd extractors
          uv run energy-extract chile \
            --start-date "${{ steps.latest.outputs.start_date }}" \
            --end-date "${{ steps.latest.outputs.end_date }}" \
            --output ../extracted_data \
            --log-level INFO

      - name: Load Chile data into Neon
        run: |
          for f in extracted_data/chile_*_etl.jsonl; do
            echo "Loading $f..."
            uv run python src/database_management.py load-data chile "$f"
          done

      - name: Upload artifacts (on failure only)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: chile-extraction-${{ github.run_id }}
          path: |
            extracted_data/*.jsonl
            extracted_data/logs/
            extracted_data/extraction_metadata_*.json
          retention-days: 14

  # ─────────────────────────────────────────────
  # Climate TRACE (global, MODELED generation). No incremental window: the
  # source ships one bulk package covering 2021→now (~8s to process), and it
  # REVISES past months between releases — so every run re-extracts the full
  # history and the loader upserts (ON CONFLICT DO UPDATE) so revisions
  # propagate. Steady state writes only new months + genuine revisions.
  # Loaded at medium+ confidence for ALL countries (see the extract step) so the
  # dashboard can offer confidence as a reader-selectable filter.
  # No credentials required — the download bucket is public.
  # ─────────────────────────────────────────────
  extract-climatetrace:
    if: ${{ github.event.inputs.source == '' || github.event.inputs.source == 'all' || github.event.inputs.source == 'Climate TRACE (global)' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: extract-climatetrace
      cancel-in-progress: false
    steps:
      - name: Checkout ETL repo
        uses: actions/checkout@v4

      - name: Checkout extractors repo
        uses: actions/checkout@v4
        with:
          repository: nicholas-abad/energy-extractors
          path: extractors
          token: ${{ secrets.EXTRACTORS_REPO_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install ETL dependencies
        run: uv sync

      - name: Install extractor dependencies
        run: |
          cd extractors
          uv sync

      # ONE global extract at medium confidence, replacing the former
      # global-high + 9-hardcoded-countries-at-medium pair. The dashboard exposes
      # confidence as a reader-selectable filter across all Climate TRACE
      # countries, so the load has to carry both tiers everywhere rather than
      # medium for a hand-picked list. `activity_confidence` rides along on every
      # row, which is what the dashboard filters on.
      #
      # "medium" is a deliberate FLOOR, not a no-op. It excludes three things:
      # "very low" and "low" ratings (both are on Climate TRACE's activity scale),
      # and unrated plant-months, which rank below every minimum. That is the
      # intent — every figure the dashboard shows is at least medium confidence.
      #
      # Do NOT rewrite this as `--min-confidence none` on the assumption that it
      # is equivalent. It happened to drop no rows as of release v5.8.0, where
      # Climate TRACE rated 23,212 plant-months "very low" but published activity
      # data for none of them (765,996 ratings vs 742,784 data rows). No
      # `--release` is pinned below and the extractor default is the moving
      # `latest` alias, so treat those counts as a v5.8.0 observation, not a
      # standing property.
      - name: Extract Climate TRACE data (full history, medium+ confidence)
        run: |
          cd extractors
          uv run energy-extract climatetrace \
            --min-confidence medium \
            --output ../extracted_data \
            --log-level INFO

      - name: Load Climate TRACE data into Neon
        run: |
          for f in extracted_data/climatetrace_*_etl.jsonl; do
            echo "Loading $f..."
            uv run python src/database_management.py load-data climatetrace "$f"
          done

      - name: Upload artifacts (on failure only)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: climatetrace-extraction-${{ github.run_id }}
          path: |
            extracted_data/*.jsonl
            extracted_data/logs/
            extracted_data/extraction_metadata_*.json
          retention-days: 14

  # ─────────────────────────────────────────────
  # GEM reference tables — mirror Global Energy Monitor's power trackers from
  # their API into gem_locations / gem_units / gem_unit_status_snapshots.
  # Core pull every week (< 1 min); the per-unit detail pull only when GEM has
  # published a new release (~40 min, throttled). GEM's API is the SOLE
  # reference for plant identity — no spreadsheet.
  # ─────────────────────────────────────────────
  fetch-gem:
    # Full runs only: a single-source manual dispatch must not trigger the
    # crosswalk rebuild + prod swap (rebuild-crosswalk is gated on this job).
    if: ${{ github.event.inputs.source == '' || github.event.inputs.source == 'all' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    concurrency:
      group: fetch-gem
      cancel-in-progress: false
    steps:
      - name: Checkout plant-data repo
        uses: actions/checkout@v4
        with:
          repository: nicholas-abad/plant-data
          path: plant-data
          token: ${{ secrets.EXTRACTORS_REPO_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Mirror GEM into Neon
        run: |
          cd plant-data
          uv sync
          uv run python scripts/fetch_gem.py

  # ─────────────────────────────────────────────
  # Crosswalk rebuild — every source, on the GEM tables. Human decisions on
  # plant_crosswalk are re-emitted unchanged (tier 0); only empty rows are
  # matched. Gated on fetch-gem, NOT on the NPP extractor: a failed Indian
  # extraction must not leave the crosswalk stale for every other source.
  # ─────────────────────────────────────────────
  rebuild-crosswalk:
    needs: [fetch-gem, extract-npp, extract-eia, extract-ons, extract-entsoe, extract-oe, extract-occto, extract-chile]
    # !cancelled(), not always(): a human cancelling the run must not still
    # trigger a production swap. Failed/skipped extractors do not block it.
    if: ${{ !cancelled() && needs.fetch-gem.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    concurrency:
      group: rebuild-crosswalk
      cancel-in-progress: false
    steps:
      - name: Checkout ETL repo
        uses: actions/checkout@v4

      - name: Checkout plant-data repo
        uses: actions/checkout@v4
        with:
          repository: nicholas-abad/plant-data
          path: plant-data
          token: ${{ secrets.EXTRACTORS_REPO_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Require the GEM-era plant-data (merge-order guard)
        # This workflow assumes plant-data#13 (GEM identity) is on plant-data's
        # default branch. Running the OLD builder with --force would rebuild
        # every source from scratch with no tier-0 preservation. Fail before
        # anything touches production.
        run: |
          for f in plant-data/src/gem_reference.py plant-data/scripts/import_decisions.py plant-data/scripts/export_decisions.py; do
            test -f "$f" || { echo "::error::$f missing — plant-data main predates the GEM crosswalk (merge plant-data#13 first)"; exit 1; }
          done
          grep -q "FROZEN_VALUE_COLUMNS" plant-data/src/build_crosswalk.py || { echo "::error::build_crosswalk.py lacks tier-0 frozen values"; exit 1; }

      - name: Fetch non-GEM reference data (GPPD, EIA plant lookup, NPP-GIPT)
        env:
          CROSSWALK_REF_DATA_URL: ${{ secrets.CROSSWALK_REF_DATA_URL }}
        run: |
          if [ -z "$CROSSWALK_REF_DATA_URL" ]; then
            echo "::error::CROSSWALK_REF_DATA_URL not set — the rebuild needs GPPD and the EIA plant lookup."
            exit 1
          fi
          curl -fsSL "$CROSSWALK_REF_DATA_URL" -o /tmp/refdata.tar.gz
          tar -xzf /tmp/refdata.tar.gz -C plant-data/data/crosswalks/
          missing=0
          test -f "plant-data/data/crosswalks/global_power_plant_database.csv" \
            || { echo "::error::global_power_plant_database.csv missing after extracting reference bundle"; missing=1; }
          test -f "plant-data/data/crosswalks/eia_plant_lookup.csv" \
            || { echo "::error::eia_plant_lookup.csv missing after extracting reference bundle"; missing=1; }
          test -f "plant-data/data/crosswalks/NPP_GIPT_crosswalk (1).csv" \
            || { echo "::error::NPP_GIPT_crosswalk (1).csv missing after extracting reference bundle"; missing=1; }
          [ "$missing" = "1" ] && exit 1

      - name: Rebuild crosswalk (all sources, GEM tables, tier-0 decisions preserved)
        run: |
          cd plant-data
          uv sync
          uv run python -m src.build_crosswalk --force --yes

      - name: Verify rebuilt crosswalk before loading
        # verify_crosswalk.py compares against the committed parquet: known-bad
        # regressions, ENTSO-E/HJKS capacity invariants, per-source coverage,
        # GEM-link integrity, and that every prior human decision survived.
        run: |
          cd plant-data
          uv run python scripts/verify_crosswalk.py

      - name: Load updated crosswalk into Neon
        run: |
          cd plant-data
          uv run python - <<'PY'
          import sys
          sys.path.insert(0, "scripts")
          from bootstrap_neon_db import get_engine, load_unified_crosswalk
          load_unified_crosswalk(get_engine())
          PY

      - name: Export decisions audit trail
        # Commits ONLY data/review/decisions_export.csv (who decided what, when).
        # The parquet is deliberately NOT committed weekly: the committed parquet
        # is verify_crosswalk.py's baseline and must change only through a
        # reviewed PR. Requires EXTRACTORS_REPO_TOKEN to have contents:write on
        # plant-data.
        run: |
          cd plant-data
          uv run python scripts/export_decisions.py
          git config user.name "coal-atlas-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/review/decisions_export.csv
          git diff --cached --quiet && { echo "no changes"; exit 0; }
          git commit -m "chore: decisions export ($(date -u +%F))"
          git pull --rebase --autostash origin main
          git push origin HEAD:main

  # ─────────────────────────────────────────────
  # Refresh materialized views after all loads
  # ─────────────────────────────────────────────
  refresh-views:
    # Climate TRACE is in the list since migration 005 gave it a view: without
    # it this job could start before the CT load finished and refresh
    # mv_climatetrace_coal_monthly against LAST week's rows (the CT loader
    # revises history with ON CONFLICT DO UPDATE, so that is exactly what would
    # be missed). Side effect: a manual run for Climate TRACE alone now
    # refreshes ALL views (seconds to low minutes; well inside the timeout).
    needs: [extract-eia, extract-ons, extract-entsoe, extract-npp, extract-oe, extract-occto, extract-chile, extract-climatetrace]
    if: ${{ always() && (needs.extract-eia.result == 'success' || needs.extract-ons.result == 'success' || needs.extract-entsoe.result == 'success' || needs.extract-npp.result == 'success' || needs.extract-oe.result == 'success' || needs.extract-occto.result == 'success' || needs.extract-chile.result == 'success' || needs.extract-climatetrace.result == 'success') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout ETL repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install dependencies
        run: uv sync

      - name: Refresh all materialized views
        run: uv run python src/refresh_views.py

  # ─────────────────────────────────────────────
  # Drift check — detect plants in raw tables not in plant_crosswalk
  # Informational only; opens an issue if new plants need mapping
  # ─────────────────────────────────────────────
  check-crosswalk-drift:
    # Depend on the rebuild too, so drift is checked against the rebuilt
    # crosswalk (not the pre-rebuild state, and not mid-DROP/recreate).
    needs: [refresh-views, rebuild-crosswalk]
    if: ${{ always() && needs.refresh-views.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout ETL repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install dependencies
        run: uv sync

      - name: Check for crosswalk drift
        run: uv run python src/check_crosswalk_drift.py

      - name: Open issue if drift detected
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const report = JSON.parse(fs.readFileSync('drift_report.json', 'utf8'));
            if (report.total_missing === 0) {
              core.info('No drift — skipping issue creation');
              return;
            }

            const lines = [
              `## Plant Crosswalk Drift Detected`,
              ``,
              `**Run:** [${context.runId}](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`,
              `**Date:** ${new Date().toISOString().split('T')[0]}`,
              `**Total unmapped plants:** ${report.total_missing}`,
              ``,
              `These plants appear in raw generation tables but have no entry in \`plant_crosswalk\`. They will display in the dashboard with NULL coordinates until the crosswalk is rebuilt.`,
              ``,
              `### By Source`,
              ``,
              `| Source | Missing | Sample (first 20) |`,
              `|---|---|---|`,
            ];
            for (const [src, info] of Object.entries(report.by_source)) {
              const sample = info.sample.length > 0
                ? info.sample.map(s => `\`${s}\``).join(', ')
                : '—';
              lines.push(`| ${src} | ${info.count} | ${sample} |`);
            }
            lines.push(``);
            lines.push(`### To Fix`);
            lines.push(``);
            lines.push(`Rebuild the crosswalk in the \`plant-data\` repo:`);
            lines.push(`\`\`\`bash`);
            lines.push(`cd data/plant-data`);
            lines.push(`uv run python -m src.build_crosswalk --no-llm  # try fuzzy matching first`);
            lines.push(`uv run python -m src.build_crosswalk           # fallback to LLM if needed`);
            lines.push(`uv run python scripts/bootstrap_neon_db.py --data-only`);
            lines.push(`\`\`\``);

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Plant crosswalk drift: ${report.total_missing} unmapped plants`,
              body: lines.join('\n'),
              labels: ['crosswalk-drift', 'automated'],
            });

  # ─────────────────────────────────────────────
  # Dashboard read-only role — assert its SELECT surface is exactly the
  # intended set. Runs AFTER the crosswalk rebuild because that job swaps
  # plant_crosswalk via DROP + RENAME, which is how a grant silently vanishes.
  # Skips (NOTICE) when the role does not exist yet.
  # ─────────────────────────────────────────────
  check-dashboard-ro-surface:
    needs: [refresh-views, rebuild-crosswalk]
    if: ${{ always() && needs.refresh-views.result != 'cancelled' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout ETL repo
        uses: actions/checkout@v4

      - name: Check dashboard_ro surface
        env:
          PGPASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          PGSSLMODE: require
        run: |
          psql -h "$POSTGRES_HOST" -p "${POSTGRES_PORT:-5432}" -U "$POSTGRES_USER" -d "$POSTGRES_DB" \
               -v ON_ERROR_STOP=1 -f schema/checks/dashboard_ro_surface.sql

  # ─────────────────────────────────────────────
  # Notify on failure — create GitHub Issue
  # ─────────────────────────────────────────────
  notify-failure:
    needs: [extract-eia, extract-ons, extract-entsoe, extract-npp, extract-oe, extract-occto, extract-chile, extract-climatetrace, fetch-gem, rebuild-crosswalk, refresh-views, check-crosswalk-drift, check-dashboard-ro-surface]
    if: ${{ always() && contains(needs.*.result, 'failure') }}
    runs-on: ubuntu-latest
    steps:
      - name: Create failure issue
        uses: actions/github-script@v7
        with:
          script: |
            const jobs = {
              'extract-eia': '${{ needs.extract-eia.result }}',
              'extract-ons': '${{ needs.extract-ons.result }}',
              'extract-entsoe': '${{ needs.extract-entsoe.result }}',
              'extract-npp': '${{ needs.extract-npp.result }}',
              'extract-oe': '${{ needs.extract-oe.result }}',
              'extract-occto': '${{ needs.extract-occto.result }}',
              'extract-chile': '${{ needs.extract-chile.result }}',
              'extract-climatetrace': '${{ needs.extract-climatetrace.result }}',
              'refresh-views': '${{ needs.refresh-views.result }}',
              'check-crosswalk-drift': '${{ needs.check-crosswalk-drift.result }}',
              'fetch-gem': '${{ needs.fetch-gem.result }}',
              'rebuild-crosswalk': '${{ needs.rebuild-crosswalk.result }}',
              'check-dashboard-ro-surface': '${{ needs.check-dashboard-ro-surface.result }}',
            };
            const failed = Object.entries(jobs)
              .filter(([_, v]) => v === 'failure')
              .map(([k, _]) => k);

            const body = [
              `## Weekly Extraction Failed`,
              ``,
              `**Run:** [${context.runId}](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`,
              `**Trigger:** ${context.eventName}`,
              `**Date:** ${new Date().toISOString().split('T')[0]}`,
              ``,
              `### Failed Jobs`,
              ...failed.map(j => `- ❌ \`${j}\``),
              ``,
              `### All Job Results`,
              ...Object.entries(jobs).map(([k, v]) => `- ${v === 'success' ? '✅' : v === 'failure' ? '❌' : '⏭️'} \`${k}\`: ${v}`),
              ``,
              `Please check the [workflow run](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}) for error details.`,
            ].join('\n');

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `🚨 Weekly extraction failed: ${failed.join(', ')}`,
              body: body,
              labels: ['extraction-failure', 'automated'],
            });
